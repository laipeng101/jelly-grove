name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    # Keep these paths aligned with the standalone build inputs.
    paths:
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - .npmrc
      - tsconfig.json
      - vite.config.ts
      - scripts/package-offline.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - name: Check bundled boards
        run: node --import tsx --test tests/generation/backups.test.ts
      - run: npm run build
      - name: Prepare site
        # The standalone build embeds all assets, so it also works under the
        # repository URL without changing Vite's base or the offline build.
        run: |
          site="${{ runner.temp }}/pages"
          offline="dist/果冻果园.html"
          mkdir -p "$site"
          cp "$offline" "$site/index.html"
          cp "$offline" "$site/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
